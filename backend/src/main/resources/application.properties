spring.application.name=backend

#spring.datasource.url=jdbc:postgresql://172.21.176.1:5432/serverpulse_db
spring.datasource.url=jdbc:postgresql://localhost:5432/serverpulse_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

serverpulse.alert.thresholds.cpu.warning=70
serverpulse.alert.thresholds.cpu.critical=90
serverpulse.alert.thresholds.memory.warning=75
serverpulse.alert.thresholds.memory.critical=90
serverpulse.alert.thresholds.disk.warning=80
serverpulse.alert.thresholds.disk.critical=95
